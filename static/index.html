<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語学習アプリ</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=20260910-delete1">
</head>
<body>
    <div id="app" class="app-root" :class="{ 'sidebar-open': sidebarOpen }"
         @dragover="handleAppDragOver($event)"
         @drop="handleAppDrop($event)">
        <button class="sidebar-backdrop" type="button" aria-label="メニューを閉じる" @click="sidebarOpen = false"></button>

        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-mark">R</div>
                <div>
                    <div class="brand-name">ReadMate</div>
                    <div class="brand-sub">English reader</div>
                </div>
            </div>

            <button class="new-doc-btn" type="button" @click="newDocument">
                <i data-lucide="plus"></i>
                <span>新しい文章</span>
            </button>

            <div class="sidebar-section">History</div>
            <div class="doc-list">
                <div v-for="doc in documents" :key="doc.id"
                     class="doc-item" :class="{ active: current && current.id === doc.id }"
                     @click="selectDocument(doc.id)">
                    <span class="doc-title">{{ doc.title }}</span>
                    <button class="doc-delete" type="button" title="削除" @click.stop="deleteDocument(doc.id)">
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>
                <div v-if="documents.length === 0" class="empty-history">No documents</div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="icon-button sidebar-toggle" type="button" title="メニュー" @click="sidebarOpen = true">
                    <i data-lucide="menu"></i>
                </button>

                <div class="page-title">
                    <span class="eyebrow">AI English Reader</span>
                    <h1>{{ current ? current.title : '英文を読める教材に変える' }}</h1>
                </div>

                <div class="menu-wrap">
                    <button class="icon-button" type="button" title="設定" @click="menuOpen = !menuOpen">
                        <i data-lucide="sliders-horizontal"></i>
                    </button>
                    <div v-if="menuOpen" class="menu-panel">
                        <label class="setting-label">単語抽出の難易度</label>
                        <select v-model="settings.level" class="form-select form-select-sm" @change="saveSettings">
                            <option value="beginner">初級: 広めに抽出</option>
                            <option value="intermediate">中級: 高校レベル以上</option>
                            <option value="advanced">上級: 難単語のみ</option>
                        </select>
                        <label class="setting-check">
                            <input type="checkbox" v-model="settings.autoArchiveKnown" @change="saveSettings">
                            <span>正解した単語を次回から出さない</span>
                        </label>
                    </div>
                </div>
            </header>

            <div v-if="!current" class="input-view">
                <div class="input-heading">
                    <span class="eyebrow">Start</span>
                    <h2>英文入力</h2>
                </div>

                <textarea v-model="inputText" class="form-control text-input" placeholder="ここに英語の文章を貼り付け..."></textarea>

                <div class="input-actions">
                    <button class="button button-primary" type="button" @click="translate" :disabled="isTranslating">
                        <i data-lucide="languages"></i>
                        <span>{{ isTranslating ? '翻訳中...' : '翻訳する' }}</span>
                    </button>

                    <label class="file-picker">
                        <input type="file" ref="fileInput" accept=".pdf,.png,.jpg,.jpeg">
                        <span>PDF / 画像</span>
                    </label>

                    <button class="button button-secondary" type="button" @click="uploadFile" :disabled="isTranslating">
                        <i data-lucide="upload"></i>
                        <span>{{ isTranslating ? '処理中...' : 'ファイルから翻訳' }}</span>
                    </button>
                </div>

                <div v-if="error" class="alert-message">{{ error }}</div>
            </div>

            <template v-else>
                <div class="reader-layout" :class="'focus-' + focusPane">
                    <section class="reader-pane" v-show="focusPane !== 'ja'">
                        <div class="pane-header">
                            <span>English</span>
                            <button class="pane-toggle" type="button"
                                    :title="focusPane === 'en' ? '並べて表示' : '英語を最大化'"
                                    @click="toggleFocus('en')">
                                <i :data-lucide="focusPane === 'en' ? 'minimize-2' : 'maximize-2'"></i>
                            </button>
                        </div>
                        <pre>{{ current.en_text }}</pre>
                    </section>

                    <section class="reader-pane reader-pane-ja" v-show="focusPane !== 'en'">
                        <div class="pane-header">
                            <span>Japanese</span>
                            <button class="pane-toggle" type="button"
                                    :title="focusPane === 'ja' ? '並べて表示' : '日本語を最大化'"
                                    @click="toggleFocus('ja')">
                                <i :data-lucide="focusPane === 'ja' ? 'minimize-2' : 'maximize-2'"></i>
                            </button>
                        </div>
                        <pre>{{ current.ja_text }}</pre>
                    </section>
                </div>

                <section class="word-area" :class="{ collapsed: wordCollapsed, 'delete-ready': deleteDropReady }">
                    <div v-if="draggingWord && deleteDropReady" class="delete-drop-mark" aria-hidden="true">
                        <i data-lucide="trash-2"></i>
                    </div>
                    <div class="word-header">
                        <div class="word-heading">
                            <button class="pane-toggle" type="button"
                                    :title="wordCollapsed ? '単語ピックを開く' : '単語ピックを最小化'"
                                    @click="wordCollapsed = !wordCollapsed">
                                <i :data-lucide="wordCollapsed ? 'chevron-up' : 'chevron-down'"></i>
                            </button>
                            <div>
                                <span class="eyebrow">Vocabulary</span>
                                <h2>単語ピック<span v-if="currentWordCount"> ({{ activeWords.length }} / {{ currentWordCount }})</span></h2>
                            </div>
                        </div>
                        <div class="word-actions">
                            <button class="button button-secondary" type="button" @click="startQuiz('active')"
                                    :disabled="activeWords.length === 0">
                                <i data-lucide="book-open-check"></i>
                                <span>単語クイズ</span>
                            </button>
                            <button class="button button-primary" type="button" @click="createWordbook" :disabled="isExtracting">
                                <i data-lucide="list-plus"></i>
                                <span>{{ isExtracting ? '作成中...' : '単語帳を作成' }}</span>
                            </button>
                        </div>
                    </div>

                    <template v-if="!quizMode && !wordCollapsed">
                        <div class="word-board">
                            <section class="word-zone"
                                     :class="{ 'drop-target': dragOverZone === 'active' }"
                                     @dragenter.prevent="dragOverWordZone('active', $event)"
                                     @dragover.prevent="dragOverWordZone('active', $event)"
                                     @dragleave="leaveWordZone('active', $event)"
                                     @drop.prevent="dropWord('active', $event)">
                                <div class="zone-header">
                                    <span>出題する</span>
                                    <strong>{{ activeWords.length }}</strong>
                                </div>
                                <div class="word-chips">
                                    <span v-if="!current.words || current.words.length === 0" class="empty-state">
                                        単語帳を作成すると、この文章の重要単語を抽出します。
                                    </span>
                                    <span v-else-if="activeWords.length === 0" class="empty-state">
                                        出題する単語がありません。
                                    </span>
                                    <div v-for="w in activeWords" :key="w.word" class="word-chip"
                                         draggable="true"
                                         role="button"
                                         tabindex="0"
                                         :class="{ dragging: draggingWord && wordKey(draggingWord.word) === wordKey(w.word) }"
                                         :title="w.meaning"
                                         @click="toggleWord(w.word)"
                                         @keydown.enter.prevent="toggleWord(w.word)"
                                         @keydown.space.prevent="toggleWord(w.word)"
                                         @dragstart="startWordDrag(w, 'active', $event)"
                                         @drag="trackWordDrag($event)"
                                         @dragend="endWordDrag($event)">
                                        <span class="drag-handle" aria-hidden="true"><i data-lucide="grip-vertical"></i></span>
                                        <span>{{ w.word }}</span>
                                        <span v-if="revealed[w.word]" class="word-meaning">{{ w.meaning }}</span>
                                    </div>
                                </div>
                            </section>

                            <section class="word-zone word-zone-muted"
                                     :class="{ 'drop-target': dragOverZone === 'archived' }"
                                     @dragenter.prevent="dragOverWordZone('archived', $event)"
                                     @dragover.prevent="dragOverWordZone('archived', $event)"
                                     @dragleave="leaveWordZone('archived', $event)"
                                     @drop.prevent="dropWord('archived', $event)">
                                <div class="zone-header">
                                    <span>出さない</span>
                                    <strong>{{ archivedWords.length }}</strong>
                                </div>
                                <div class="word-chips">
                                    <span v-if="archivedWords.length === 0" class="empty-state">
                                        出さない単語はありません。
                                    </span>
                                    <div v-for="w in archivedWords" :key="w.word" class="word-chip muted"
                                         draggable="true"
                                         role="button"
                                         tabindex="0"
                                         :class="{ dragging: draggingWord && wordKey(draggingWord.word) === wordKey(w.word) }"
                                         :title="w.meaning"
                                         @click="toggleWord(w.word)"
                                         @keydown.enter.prevent="toggleWord(w.word)"
                                         @keydown.space.prevent="toggleWord(w.word)"
                                         @dragstart="startWordDrag(w, 'archived', $event)"
                                         @drag="trackWordDrag($event)"
                                         @dragend="endWordDrag($event)">
                                        <span class="drag-handle" aria-hidden="true"><i data-lucide="grip-vertical"></i></span>
                                        <span>{{ w.word }}</span>
                                        <span v-if="revealed[w.word]" class="word-meaning">{{ w.meaning }}</span>
                                    </div>
                                </div>
                            </section>
                        </div>
                        <div v-if="error" class="alert-message compact">{{ error }}</div>
                    </template>

                    <div v-else-if="quizMode && !wordCollapsed" class="quiz-box">
                        <template v-if="!quizFinished">
                            <div class="quiz-count">{{ quizIndex + 1 }} / {{ quizWords.length }}</div>
                            <div class="quiz-word">{{ quizWords[quizIndex].word }}</div>
                            <button v-if="!quizRevealed" class="button button-primary" type="button" @click="quizRevealed = true">
                                <i data-lucide="eye"></i>
                                <span>意味を表示</span>
                            </button>
                            <template v-else>
                                <div class="quiz-meaning">{{ quizWords[quizIndex].meaning }}</div>
                                <div class="quiz-actions">
                                    <button class="button button-secondary" type="button" @click="answerQuiz(false)">
                                        <i data-lucide="arrow-left"></i>
                                        <span>分からなかった</span>
                                    </button>
                                    <button class="button button-primary" type="button" @click="answerQuiz(true)">
                                        <span>分かった</span>
                                        <i data-lucide="arrow-right"></i>
                                    </button>
                                </div>
                            </template>
                        </template>

                        <template v-else>
                            <div class="quiz-word">結果</div>
                            <div class="quiz-meaning">
                                分かった: {{ knownCount }}<br>
                                分からなかった: {{ wrongCount }}
                            </div>
                            <div class="quiz-actions">
                                <button class="button button-primary" type="button" @click="startQuiz('wrong')"
                                        :disabled="wrongCount === 0">
                                    <i data-lucide="repeat-2"></i>
                                    <span>間違いだけ復習</span>
                                </button>
                                <button class="button button-secondary" type="button" @click="startQuiz('active')">
                                    <i data-lucide="rotate-ccw"></i>
                                    <span>もう一度</span>
                                </button>
                                <button class="button button-secondary" type="button" @click="quizMode = false">
                                    <i data-lucide="x"></i>
                                    <span>閉じる</span>
                                </button>
                            </div>
                        </template>
                    </div>
                </section>
            </template>
        </main>
    </div>

    <script src="/static/js/app.js?v=20260910-delete1"></script>
</body>
</html>
