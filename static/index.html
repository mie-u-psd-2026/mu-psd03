<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語学習アプリ</title>
    <!-- Vue.jsをCDNから読み込み -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- BootStrapをCDNから読み込み -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <!-- アプリのスタイル -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div id="app" class="app-root">
        <!-- 左: 文章一覧 (ChatGPT風) -->
        <aside class="sidebar">
            <button class="btn btn-light w-100 mb-2 border" @click="newDocument">＋ 新しい文章</button>
            <div v-for="doc in documents" :key="doc.id"
                 class="doc-item" :class="{ active: current && current.id === doc.id }"
                 @click="selectDocument(doc.id)">
                <span class="doc-title">{{ doc.title }}</span>
                <button class="doc-delete" title="削除" @click.stop="deleteDocument(doc.id)">✕</button>
            </div>
        </aside>

        <main class="main">
            <!-- 入力ビュー(文章未選択時) -->
            <div v-if="!current" class="input-view">
                <h5>英文を入力してください</h5>
                <textarea v-model="inputText" class="form-control" placeholder="ここに英語の文章を貼り付け..."></textarea>
                <div>
                    <button class="btn btn-primary" @click="translate" :disabled="isTranslating">
                        {{ isTranslating ? '翻訳中...' : '翻訳する' }}
                    </button>
                </div>
                <div v-if="error" class="alert alert-danger mb-0">{{ error }}</div>
            </div>

            <!-- 文書ビュー -->
            <template v-else>
                <div class="panels">
                    <section class="panel panel-en">
                        <div class="panel-label">英語</div>
                        <pre>{{ current.en_text }}</pre>
                    </section>
                    <section class="panel panel-ja">
                        <div class="panel-label">日本語</div>
                        <pre>{{ current.ja_text }}</pre>
                    </section>
                </div>

                <section class="word-area">
                    <div class="panel-label">単語ピック</div>

                    <!-- 通常モード: 単語チップ一覧 -->
                    <template v-if="!quizMode">
                        <div class="word-chips">
                            <span v-if="!current.words || current.words.length === 0" class="text-muted">
                                「単語帳を作成」を押すと、この文章の重要単語を抽出します。
                            </span>
                            <button v-for="w in current.words" :key="w.word" class="word-chip"
                                    @click="toggleWord(w.word)" :title="w.meaning">
                                {{ w.word }}<span v-if="revealed[w.word]"> — {{ w.meaning }}</span>
                            </button>
                        </div>
                        <div v-if="error" class="alert alert-danger mt-2 mb-0 py-1">{{ error }}</div>
                        <div class="word-buttons">
                            <button class="action-btn" @click="startQuiz"
                                    :disabled="!current.words || current.words.length === 0">単語クイズ</button>
                            <button class="action-btn" @click="createWordbook" :disabled="isExtracting">
                                {{ isExtracting ? '作成中...' : '単語帳を作成' }}
                            </button>
                        </div>
                    </template>

                    <!-- クイズモード -->
                    <div v-else class="quiz-box">
                        <template v-if="!quizFinished">
                            <div class="text-muted">{{ quizIndex + 1 }} / {{ quizWords.length }}</div>
                            <div class="quiz-word">{{ quizWords[quizIndex].word }}</div>
                            <button v-if="!quizRevealed" class="btn btn-outline-primary" @click="quizRevealed = true">意味を表示</button>
                            <template v-else>
                                <div class="quiz-meaning">{{ quizWords[quizIndex].meaning }}</div>
                                <div class="d-flex justify-content-center gap-3 mt-2">
                                    <button class="btn btn-outline-danger" @click="answerQuiz(false)">← 分からなかった</button>
                                    <button class="btn btn-outline-success" @click="answerQuiz(true)">分かった →</button>
                                </div>
                            </template>
                        </template>
                        <template v-else>
                            <div class="quiz-word">結果</div>
                            <div class="quiz-meaning">
                                分かった: {{ knownCount }} / {{ quizWords.length }}<br>
                                分からなかった: {{ quizWords.length - knownCount }}
                            </div>
                            <div class="d-flex justify-content-center gap-3 mt-2">
                                <button class="btn btn-outline-primary" @click="startQuiz">もう一度</button>
                                <button class="btn btn-outline-secondary" @click="quizMode = false">閉じる</button>
                            </div>
                        </template>
                    </div>
                </section>
            </template>
        </main>
    </div>

    <!-- アプリ本体のスクリプト(Vueより後に読み込む) -->
    <script src="/static/js/app.js"></script>
</body>
</html>
